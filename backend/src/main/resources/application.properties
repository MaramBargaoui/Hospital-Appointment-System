spring.application.name=hospital-api
server.port=8080

# SQLite file DB — path is relative to the JVM working directory (run the API from /backend).
# File on disk: backend/data/hospital.db
spring.datasource.url=jdbc:sqlite:./data/hospital.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=
# WAL helps when browsing the file in DB Browser while the API is running (fewer lock issues).
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys = ON; PRAGMA journal_mode = WAL; PRAGMA busy_timeout = 15000;

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# JWT (dev only — replace for production)
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# Default admin (created when database is empty)
app.seed.admin-email=admin@hospital.test
app.seed.admin-password=Admin123!

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
