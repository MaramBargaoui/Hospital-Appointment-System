<div class="auth-page">
  <div class="auth-bg" aria-hidden="true"></div>
  <div class="auth-content">
    <header class="auth-brand">
      <div class="auth-brand-mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 4v16M8 8h8M8 16h8" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </div>
      <div class="auth-brand-titles">
        <span class="auth-brand-name">Hospital</span>
        <span class="auth-brand-sub">Appointment suite</span>
      </div>
    </header>

    <div class="card">
      <div class="card-head">
        <h1>Sign in</h1>
        <p class="sub">Use your hospital credentials to continue.</p>
      </div>

      @if (errorMessage(); as err) {
        <div class="alert" role="alert">{{ err }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()">
        <label class="field">
          <span class="field-label">Email</span>
          <input type="email" formControlName="email" autocomplete="email" placeholder="you@hospital.org" />
          @if (form.controls.email.touched && form.controls.email.invalid) {
            <small class="field-error">Valid email required</small>
          }
        </label>

        <label class="field">
          <span class="field-label">Password</span>
          <input type="password" formControlName="password" autocomplete="current-password" placeholder="••••••••" />
          @if (form.controls.password.touched && form.controls.password.invalid) {
            <small class="field-error">At least 8 characters</small>
          }
        </label>

        <button type="submit" class="primary" [disabled]="submitting()">
          {{ submitting() ? 'Signing in…' : 'Sign in' }}
        </button>
      </form>

      <p class="footer">
        No account?
        <a routerLink="/register">Create one</a>
      </p>
    </div>

    <p class="auth-footnote">Secure access · Internal use</p>
  </div>
</div>
